<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabitaGo — Alojamientos únicos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a href="#" class="logo" id="logoLink">
        <span class="logo__icon">🏠</span>
        <span class="logo__text">HabitaGo</span>
      </a>

      <div class="search-bar" id="searchBar">
        <div class="search-bar__field">
          <label>Destino</label>
          <input type="text" id="inputDestino" placeholder="¿A dónde vas?" value="">
        </div>
        <div class="search-bar__field search-bar__field--dates">
          <label>Llegada</label>
          <input type="date" id="inputLlegada">
        </div>
        <div class="search-bar__field search-bar__field--dates">
          <label>Salida</label>
          <input type="date" id="inputSalida">
        </div>
        <div class="search-bar__field">
          <label>Huéspedes</label>
          <input type="number" id="inputHuespedes" min="1" max="16" placeholder="¿Cuántos?">
        </div>
        <button class="search-bar__button" id="btnBuscar" aria-label="Buscar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
        </button>
      </div>

      <button class="btn-ver-reservas" id="btnVerReservas">🗓️ Mis reservas</button>
    </div>
  </header>

  <main>
    <section class="filters" id="filters">
      <div class="filters__row">
        <select id="filtroCategoria" class="filters__select">
          <option value="">Categoría</option>
        </select>
        <select id="filtroCiudad" class="filters__select">
          <option value="">Ciudad</option>
        </select>
        <select id="filtroPrecio" class="filters__select">
          <option value="20000">Cualquier precio</option>
          <option value="1000">Hasta $1,000</option>
          <option value="2000">Hasta $2,000</option>
          <option value="3000">Hasta $3,000</option>
          <option value="5000">Hasta $5,000</option>
        </select>
        <button class="filters__clear" id="btnLimpiarFiltros" hidden>Limpiar filtros</button>
      </div>
      <p class="filters__result-count" id="resultadoCount"></p>
    </section>

    <section class="grid" id="gridPropiedades" aria-live="polite"></section>

    <section class="empty-state" id="emptyState" hidden>
      <span class="empty-state__icon">🔍</span>
      <h2>No encontramos alojamientos</h2>
      <p>Prueba con otra ciudad, cambia los filtros o reduce el número de huéspedes.</p>
    </section>
  </main>

  <footer class="footer">
    <p>HabitaGo &copy; 2026 — Proyecto educativo inspirado en Airbnb</p>
  </footer>

  <div class="modal" id="modalDetalle" hidden>
    <div class="modal__overlay" id="modalOverlay"></div>
    <div class="modal__content">
      <button class="modal__close" id="modalCerrar" aria-label="Cerrar">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="modal" id="modalReservas" hidden>
    <div class="modal__overlay" id="modalReservasOverlay"></div>
    <div class="modal__content">
      <button class="modal__close" id="modalReservasCerrar" aria-label="Cerrar">&times;</button>
      <div id="modalReservasBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
